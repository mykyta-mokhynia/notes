@if (loading()) {
  <div class="loading">Loading page…</div>
} @else if (error()) {
  <div class="error">{{ error() }}</div>
} @else if (note()) {
  <div class="note-editor">
    <app-unified-note-editor
      [note]="note()!"
      [blocks]="blocks()"
      [canEdit]="access.canEdit()"
      (deleteRequested)="deleteNote()"
      (updatedAtChange)="handleBodyUpdatedAt($event)"
    >
      <header class="note-header" note-header-slot>
        <div class="note-heading-row">
          <div class="note-heading-content">
            <h1 class="note-title">{{ note()!.title }}</h1>
            <div class="note-meta">
              @if (hasPublicCreator()) {
                <span
                  class="note-creator-avatar note-creator-avatar--inline"
                  [style.background]="creatorColor()"
                  [attr.aria-label]="creatorLabel()"
                >
                  {{ creatorInitials() }}
                </span>
                <span class="note-author">by {{ creatorLabel() }}</span>
              }
              <span class="note-visibility-badge" [class.note-visibility-badge--public]="note()!.visibility === 'PUBLIC'" [class.note-visibility-badge--private]="note()!.visibility === 'PRIVATE'">
                {{ note()!.visibility === 'PUBLIC' ? 'Public' : 'Private' }}
              </span>
              @if (!access.canEdit()) {
                <span class="note-meta-date">Read-only access</span>
              }
            </div>
          </div>
        </div>
      </header>
    </app-unified-note-editor>
  </div>
}
